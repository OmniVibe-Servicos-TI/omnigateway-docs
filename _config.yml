title: OmniGateway
description: Manual do usuário para o sistema OmniGateway
theme: just-the-docs
color_scheme: dark

# Público em https://ogw.omnivibe.com.br/docs/ . O Worker faz proxy de
# /docs e /docs/* para o GitHub Pages. `url` é só a origem: o jekyll-seo-tag
# concatena url + baseurl no canonical e no og:url. O endereço direto em
# github.io/omnigateway-docs fica sem o prefixo certo de propósito.
url: https://ogw.omnivibe.com.br
baseurl: /docs

aux_links:
  OmniVibe: https://www.omnivibe.com.br

search_enabled: true
heading_anchors: true
